    <script>
        // Use the existing global supabase variable from the CDN
        // DON'T create a new one - just configure it
        if (window.supabase) {
            console.log('Supabase already loaded globally');
            
            // Configure the existing client with your URL and key
            const SUPABASE_URL = 'https://wkcbggxtmwttdjxtoieh.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_SkNcPG8vCj2xB-KORM4_tQ_Q2_MlBwe';
            
            // Create client with a different name to avoid conflict
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true
                }
            });
            
            // Use supabaseClient instead of supabase
            console.log('Supabase client configured successfully');
            
            // Store loaded data
            let currentUser = null;
            let userProfile = null;
            let period = '30';
            let userCurrency = 'EUR';
            
            // Chart instances
            let incomeSourcesChart = null;
            let expensesChart = null;
            let moneyFlowChart = null;

            // Format currency
            function formatCurrency(amount) {
                if (!amount || isNaN(amount)) {
                    amount = 0;
                }
                
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: userCurrency,
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(amount);
            }

            // Check authentication
            async function checkAuth() {
                try {
                    const { data: { user }, error } = await supabaseClient.auth.getUser();
                    
                    if (error || !user) {
                        console.log('Not authenticated, redirecting to login');
                        window.location.href = 'login.html';
                        return false;
                    }
                    
                    currentUser = user;
                    console.log('User authenticated:', user.email);
                    return true;
                } catch (error) {
                    console.error('Auth check error:', error);
                    return false;
                }
            }

            // Load user profile from database
            async function loadUserProfile() {
                try {
                    console.log('Loading profile for user:', currentUser.id);
                    
                    // Load from user_profiles table
                    const { data: profile, error } = await supabaseClient
                        .from('user_profiles')
                        .select('*')
                        .eq('id', currentUser.id)
                        .single();

                    if (error) {
                        console.log('No profile found, using demo data:', error.message);
                        
                        // Create demo data structure
                        userProfile = {
                            id: currentUser.id,
                            currency: 'EUR',
                            income_sources: [
                                { name: 'Freelance Work', amount: 2500 },
                                { name: 'Consulting', amount: 1500 },
                                { name: 'Product Sales', amount: 800 }
                            ],
                            expenses: [
                                { category: 'Rent', amount: 1200 },
                                { category: 'Utilities', amount: 200 },
                                { category: 'Groceries', amount: 400 },
                                { category: 'Entertainment', amount: 300 }
                            ]
                        };
                        
                    } else {
                        console.log('Profile loaded successfully:', profile);
                        userProfile = profile;
                    }
                    
                    // Set user currency
                    if (userProfile?.currency) {
                        userCurrency = userProfile.currency;
                    } else if (currentUser.user_metadata?.currency) {
                        userCurrency = currentUser.user_metadata.currency;
                    }
                    
                    console.log('Using currency:', userCurrency);
                    return userProfile;
                    
                } catch (error) {
                    console.error('Error loading profile:', error);
                    
                    // Fallback to demo data
                    userProfile = {
                        id: currentUser.id,
                        currency: 'EUR',
                        income_sources: [
                            { name: 'Salary', amount: 3000 },
                            { name: 'Freelance', amount: 1200 }
                        ],
                        expenses: [
                            { category: 'Rent', amount: 1500 },
                            { category: 'Food', amount: 600 },
                            { category: 'Transport', amount: 300 }
                        ]
                    };
                    
                    return userProfile;
                }
            }

            // Calculate report data
            function calculateReportData() {
                console.log('Calculating report data from profile:', userProfile);
                
                // Get data from profile
                const incomeSources = userProfile?.income_sources || [];
                const expenses = userProfile?.expenses || [];
                
                console.log('Income sources:', incomeSources);
                console.log('Expenses:', expenses);
                
                // Calculate totals
                let totalIncome = 0;
                let totalExpenses = 0;
                
                if (Array.isArray(incomeSources)) {
                    totalIncome = incomeSources.reduce((sum, source) => {
                        const amount = parseFloat(source?.amount) || 0;
                        return sum + amount;
                    }, 0);
                }
                
                if (Array.isArray(expenses)) {
                    totalExpenses = expenses.reduce((sum, expense) => {
                        const amount = parseFloat(expense?.amount) || 0;
                        return sum + amount;
                    }, 0);
                }
                
                const netFlow = totalIncome - totalExpenses;
                
                console.log('Totals - Income:', totalIncome, 'Expenses:', totalExpenses, 'Net:', netFlow);
                
                // Group income by source
                const incomeBySource = {};
                if (Array.isArray(incomeSources)) {
                    incomeSources.forEach(source => {
                        if (source && source.name) {
                            const name = source.name;
                            const amount = parseFloat(source.amount) || 0;
                            incomeBySource[name] = (incomeBySource[name] || 0) + amount;
                        }
                    });
                }
                
                // Group expenses by category
                const expensesByCategory = {};
                if (Array.isArray(expenses)) {
                    expenses.forEach(expense => {
                        if (expense && expense.category) {
                            const category = expense.category;
                            const amount = parseFloat(expense.amount) || 0;
                            expensesByCategory[category] = (expensesByCategory[category] || 0) + amount;
                        }
                    });
                }
                
                return {
                    totalIncome,
                    totalExpenses,
                    netFlow,
                    incomeBySource,
                    expensesByCategory,
                    incomeSources,
                    expenses
                };
            }

            // Create Income Sources Chart
            function createIncomeSourcesChart() {
                const ctx = document.getElementById('incomeSourcesChart');
                if (!ctx) {
                    console.error('Income sources chart canvas not found!');
                    return;
                }
                
                // Destroy existing chart if it exists
                if (incomeSourcesChart) {
                    incomeSourcesChart.destroy();
                }
                
                const reportData = calculateReportData();
                const incomeLabels = Object.keys(reportData.incomeBySource);
                const incomeValues = Object.values(reportData.incomeBySource);
                
                console.log('Creating income chart with:', incomeLabels, incomeValues);
                
                if (incomeLabels.length === 0) {
                    ctx.parentElement.innerHTML = '<div class="no-data">No income data available. Add income sources in Settings.</div>';
                    document.getElementById('incomeSourcesSummary').innerHTML = '';
                    return;
                }
                
                try {
                    incomeSourcesChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: incomeLabels,
                            datasets: [{
                                data: incomeValues,
                                backgroundColor: [
                                    '#10b981', '#3b82f6', '#8b5cf6', '#f59e0b', '#ef4444'
                                ],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                },
                                tooltip: {
                                    callbacks: {
                                        label: (context) => {
                                            const value = context.raw || 0;
                                            const total = reportData.totalIncome || 1;
                                            const percentage = ((value / total) * 100).toFixed(1);
                                            return `${context.label}: ${formatCurrency(value)} (${percentage}%)`;
                                        }
                                    }
                                }
                            },
                            cutout: '50%'
                        }
                    });
                    
                    // Update summary
                    updateIncomeSummary(reportData);
                } catch (error) {
                    console.error('Error creating income chart:', error);
                    ctx.parentElement.innerHTML = '<div class="no-data">Error creating income chart</div>';
                }
            }

            // Update income summary
            function updateIncomeSummary(reportData) {
                const summary = document.getElementById('incomeSourcesSummary');
                if (!summary) return;
                
                let html = '';
                const entries = Object.entries(reportData.incomeBySource);
                
                if (entries.length > 0) {
                    entries.forEach(([name, amount]) => {
                        const percentage = reportData.totalIncome > 0 ? 
                            ((amount / reportData.totalIncome) * 100).toFixed(1) : 0;
                        html += `
                            <div class="summary-item money-in">
                                <span>${name}:</span>
                                <span class="summary-value">${formatCurrency(amount)} (${percentage}%)</span>
                            </div>
                        `;
                    });
                }
                
                html += `
                    <div class="summary-item total">
                        <span>Total Income:</span>
                        <span class="summary-value money-in">${formatCurrency(reportData.totalIncome)}</span>
                    </div>
                `;
                
                summary.innerHTML = html;
            }

            // Create Expenses Chart
            function createExpensesChart() {
                const ctx = document.getElementById('expensesChart');
                if (!ctx) {
                    console.error('Expenses chart canvas not found!');
                    return;
                }
                
                // Destroy existing chart if it exists
                if (expensesChart) {
                    expensesChart.destroy();
                }
                
                const reportData = calculateReportData();
                const expenseLabels = Object.keys(reportData.expensesByCategory);
                const expenseValues = Object.values(reportData.expensesByCategory);
                
                console.log('Creating expenses chart with:', expenseLabels, expenseValues);
                
                if (expenseLabels.length === 0) {
                    ctx.parentElement.innerHTML = '<div class="no-data">No expense data available. Add expenses in Settings.</div>';
                    document.getElementById('expensesSummary').innerHTML = '';
                    return;
                }
                
                try {
                    expensesChart = new Chart(ctx, {
                        type: 'pie',
                        data: {
                            labels: expenseLabels,
                            datasets: [{
                                data: expenseValues,
                                backgroundColor: [
                                    '#ef4444', '#f59e0b', '#3b82f6', '#8b5cf6', '#10b981'
                                ],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                },
                                tooltip: {
                                    callbacks: {
                                        label: (context) => {
                                            const value = context.raw || 0;
                                            const total = reportData.totalExpenses || 1;
                                            const percentage = ((value / total) * 100).toFixed(1);
                                            return `${context.label}: ${formatCurrency(value)} (${percentage}%)`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                    
                    // Update summary
                    updateExpensesSummary(reportData);
                } catch (error) {
                    console.error('Error creating expenses chart:', error);
                    ctx.parentElement.innerHTML = '<div class="no-data">Error creating expenses chart</div>';
                }
            }

            // Update expenses summary
            function updateExpensesSummary(reportData) {
                const summary = document.getElementById('expensesSummary');
                if (!summary) return;
                
                let html = '';
                const entries = Object.entries(reportData.expensesByCategory);
                
                if (entries.length > 0) {
                    entries.forEach(([category, amount]) => {
                        const percentage = reportData.totalExpenses > 0 ? 
                            ((amount / reportData.totalExpenses) * 100).toFixed(1) : 0;
                        html += `
                            <div class="summary-item money-out">
                                <span>${category}:</span>
                                <span class="summary-value">${formatCurrency(amount)} (${percentage}%)</span>
                            </div>
                        `;
                    });
                }
                
                html += `
                    <div class="summary-item total">
                        <span>Total Expenses:</span>
                        <span class="summary-value money-out">${formatCurrency(reportData.totalExpenses)}</span>
                    </div>
                `;
                
                summary.innerHTML = html;
            }

            // Create Money Flow Chart
            function createMoneyFlowChart() {
                const ctx = document.getElementById('moneyFlowChart');
                if (!ctx) {
                    console.error('Money flow chart canvas not found!');
                    return;
                }
                
                // Destroy existing chart if it exists
                if (moneyFlowChart) {
                    moneyFlowChart.destroy();
                }
                
                const reportData = calculateReportData();
                
                console.log('Creating money flow chart with data:', reportData);
                
                // Ensure we have valid data
                const income = reportData.totalIncome || 0;
                const expenses = reportData.totalExpenses || 0;
                const netFlow = reportData.netFlow || 0;
                
                try {
                    moneyFlowChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['Money In', 'Money Out', 'Net Cash Flow'],
                            datasets: [{
                                label: 'Amount',
                                data: [income, expenses, netFlow],
                                backgroundColor: [
                                    '#10b981', // Green for income
                                    '#ef4444', // Red for expenses
                                    netFlow >= 0 ? '#10b981' : '#ef4444' // Green/Red for net
                                ],
                                borderWidth: 1
                        }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return formatCurrency(value);
                                        }
                                    },
                                    grid: {
                                        color: 'rgba(0, 0, 0, 0.1)'
                                    }
                                },
                                x: {
                                    grid: {
                                        display: false
                                    }
                                }
                            },
                            plugins: {
                                legend: {
                                    display: false
                                },
                                tooltip: {
                                    callbacks: {
                                        label: (context) => {
                                            return `${formatCurrency(context.raw)}`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                    
                    // Update summary
                    updateMoneyFlowSummary(reportData);
                } catch (error) {
                    console.error('Error creating money flow chart:', error);
                    ctx.parentElement.innerHTML = '<div class="no-data">Error creating money flow chart</div>';
                }
            }

            // Update money flow summary
            function updateMoneyFlowSummary(reportData) {
                const summary = document.getElementById('moneyFlowSummary');
                if (!summary) return;
                
                const income = reportData.totalIncome || 0;
                const expenses = reportData.totalExpenses || 0;
                const netFlow = reportData.netFlow || 0;
                
                const total = income + expenses;
                const incomePercentage = total > 0 ? ((income / total) * 100).toFixed(1) : 0;
                const expensesPercentage = total > 0 ? ((expenses / total) * 100).toFixed(1) : 0;
                
                summary.innerHTML = `
                    <div class="summary-item money-in">
                        <span>💰 Money In:</span>
                        <span class="summary-value">${formatCurrency(income)} (${incomePercentage}%)</span>
                    </div>
                    <div class="summary-item money-out">
                        <span>💸 Money Out:</span>
                        <span class="summary-value">${formatCurrency(expenses)} (${expensesPercentage}%)</span>
                    </div>
                    <div class="summary-item total ${netFlow >= 0 ? 'net-positive' : 'net-negative'}">
                        <span>📊 Net Cash Flow:</span>
                        <span class="summary-value">${formatCurrency(netFlow)}</span>
                    </div>
                `;
            }

            // Create all charts
            function createAllCharts() {
                console.log('Creating all charts...');
                createIncomeSourcesChart();
                createExpensesChart();
                createMoneyFlowChart();
            }

            // Setup event listeners
            function setupEventListeners() {
                // Period filter
                const periodFilter = document.getElementById('periodFilter');
                if (periodFilter) {
                    periodFilter.addEventListener('change', function() {
                        period = this.value;
                        console.log('Period changed to:', period);
                        createAllCharts();
                    });
                }
                
                // Export button
                const exportBtn = document.getElementById('exportBtn');
                const exportModal = document.getElementById('exportModal');
                const closeModal = document.getElementById('closeModal');
                const cancelExport = document.getElementById('cancelExport');
                
                if (exportBtn && exportModal && closeModal) {
                    exportBtn.addEventListener('click', () => {
                        exportModal.classList.add('active');
                    });
                    
                    closeModal.addEventListener('click', () => {
                        exportModal.classList.remove('active');
                    });
                    
                    if (cancelExport) {
                        cancelExport.addEventListener('click', () => {
                            exportModal.classList.remove('active');
                        });
                    }
                    
                    // Close on outside click
                    exportModal.addEventListener('click', (e) => {
                        if (e.target === exportModal) {
                            exportModal.classList.remove('active');
                        }
                    });
                }
                
                // Toast close
                const closeToast = document.getElementById('closeToast');
                if (closeToast) {
                    closeToast.addEventListener('click', () => {
                        document.getElementById('toast').classList.remove('show');
                    });
                }
            }

            // Initialize the page
            async function initializePage() {
                console.log('=== Initializing Reports Page ===');
                
                // Check authentication
                const isAuthenticated = await checkAuth();
                if (!isAuthenticated) {
                    console.log('Authentication failed');
                    return;
                }
                
                console.log('Authentication successful');
                
                // Load user profile
                await loadUserProfile();
                
                console.log('User profile loaded:', userProfile);
                
                // Create all charts
                createAllCharts();
                
                // Setup event listeners
                setupEventListeners();
                
                console.log('=== Reports Page Initialized Successfully ===');
            }

            // Initialize when page loads
            document.addEventListener('DOMContentLoaded', initializePage);
        } else {
            console.error('Supabase not loaded! Check CDN script.');
        }
    </script>
